<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Tài Xỉu Mô Phỏng</title>
    <style>
        body {
            background-color: #1e1e1e;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #2d2d2d;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 450px;
            border: 2px solid #e1b12c;
        }

        h1 {
            color: #f1c40f;
            margin-bottom: 5px;
            font-size: 24px;
        }

        .info-panel {
            margin: 15px 0;
            background: #3a3a3a;
            padding: 10px;
            border-radius: 8px;
            text-align: left;
            font-size: 14px;
        }

        .info-panel div {
            margin: 5px 0;
        }

        .balance {
            color: #2ecc71;
            font-weight: bold;
        }

        .dice-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 25px 0;
            min-height: 80px;
        }

        .dice {
            width: 70px;
            height: 70px;
            background-color: #ffffff;
            border-radius: 10px;
            display: grid;
            grid-template: repeat(3, 1fr) / repeat(3, 1fr);
            padding: 5px;
            box-sizing: border-box;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.2);
        }

        .dot {
            width: 12px;
            height: 12px;
            background-color: #c0392b;
            border-radius: 50%;
            align-self: center;
            justify-self: center;
            visibility: hidden;
        }

        /* Vị trí các chấm trên xí ngầu */
        .dice[data-value="1"] .dot:nth-child(1) { grid-area: 2 / 2; visibility: visible; }
        
        .dice[data-value="2"] .dot:nth-child(1) { grid-area: 1 / 1; visibility: visible; }
        .dice[data-value="2"] .dot:nth-child(2) { grid-area: 3 / 3; visibility: visible; }

        .dice[data-value="3"] .dot:nth-child(1) { grid-area: 1 / 1; visibility: visible; }
        .dice[data-value="3"] .dot:nth-child(2) { grid-area: 2 / 2; visibility: visible; }
        .dice[data-value="3"] .dot:nth-child(3) { grid-area: 3 / 3; visibility: visible; }

        .dice[data-value="4"] .dot:nth-child(1) { grid-area: 1 / 1; visibility: visible; }
        .dice[data-value="4"] .dot:nth-child(2) { grid-area: 1 / 3; visibility: visible; }
        .dice[data-value="4"] .dot:nth-child(3) { grid-area: 3 / 1; visibility: visible; }
        .dice[data-value="4"] .dot:nth-child(4) { grid-area: 3 / 3; visibility: visible; }

        .dice[data-value="5"] .dot:nth-child(1) { grid-area: 1 / 1; visibility: visible; }
        .dice[data-value="5"] .dot:nth-child(2) { grid-area: 1 / 3; visibility: visible; }
        .dice[data-value="5"] .dot:nth-child(3) { grid-area: 2 / 2; visibility: visible; }
        .dice[data-value="5"] .dot:nth-child(4) { grid-area: 3 / 1; visibility: visible; }
        .dice[data-value="5"] .dot:nth-child(5) { grid-area: 3 / 3; visibility: visible; }

        .dice[data-value="6"] .dot:nth-child(1) { grid-area: 1 / 1; visibility: visible; }
        .dice[data-value="6"] .dot:nth-child(2) { grid-area: 1 / 3; visibility: visible; }
        .dice[data-value="6"] .dot:nth-child(3) { grid-area: 2 / 1; visibility: visible; }
        .dice[data-value="6"] .dot:nth-child(4) { grid-area: 2 / 3; visibility: visible; }
        .dice[data-value="6"] .dot:nth-child(5) { grid-area: 3 / 1; visibility: visible; }
        .dice[data-value="6"] .dot:nth-child(6) { grid-area: 3 / 3; visibility: visible; }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        input {
            padding: 10px;
            border-radius: 6px;
            border: none;
            background-color: #4a4a4a;
            color: #fff;
            font-size: 16px;
            text-align: center;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-tai { background-color: #e74c3c; color: white; }
        .btn-xiu { background-color: #2980b9; color: white; }
        button:hover { opacity: 0.8; }
        button:disabled { background-color: #7f8c8d; cursor: not-allowed; }

        .result-panel {
            margin-top: 20px;
            min-height: 60px;
            font-size: 16px;
            font-weight: bold;
        }

        .text-green { color: #2ecc71; }
        .text-red { color: #e74c3c; }
        .text-yellow { color: #f1c40f; }
    </style>
</head>
<body>

<div class="container">
    <h1>TÀI XỈU MÔ PHỎNG</h1>

    <div class="info-panel">
        <div>Số dư: <span id="balance" class="balance">10,000,000,000</span>$</div>
        <div>Ván thứ: <span id="game-count" class="text-yellow">1</span></div>
        <div>Tỷ lệ thưởng: <span class="text-green">x2 số tiền cược</span></div>
        <div>Quy định: Tổng 3-10: XỈU | Tổng 11-18: TÀI</div>
    </div>

    <!-- Khu vực hiển thị 3 xí ngầu -->
    <div class="dice-container">
        <div class="dice" id="dice1" data-value="1">
            <div class="dot"></div><div class="dot"></div><div class="dot"></div>
            <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
        <div class="dice" id="dice2" data-value="2">
            <div class="dot"></div><div class="dot"></div><div class="dot"></div>
            <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
        <div class="dice" id="dice3" data-value="3">
            <div class="dot"></div><div class="dot"></div><div class="dot"></div>
            <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
    </div>

    <div class="controls">
        <input type="number" id="bet-amount" placeholder="Nhập số tiền cược" min="1" value="1000000">
        <div class="btn-group">
            <button class="btn-tai" onclick="playGame('T')">CƯỢC TÀI</button>
            <button class="btn-xiu" onclick="playGame('X')">CƯỢC XỈU</button>
        </div>
    </div>

    <div class="result-panel" id="result-message">Mời bạn nhập tiền và đặt cửa!</div>
</div>

<script>
    let balance = 10000000000;
    let gameCount = 1;
    let isRolling = false;

    function getRandomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function setDiceValues(d1, d2, d3) {
        document.getElementById('dice1').setAttribute('data-value', d1);
        document.getElementById('dice2').setAttribute('data-value', d2);
        document.getElementById('dice3').setAttribute('data-value', d3);
    }

    function playGame(choice) {
        if (isRolling) return;

        const betInput = document.getElementById('bet-amount');
        const bet = parseFloat(betInput.value);
        const resultMsg = document.getElementById('result-message');

        // Kiểm tra hợp lệ
        if (isNaN(bet) || bet <= 0) {
            resultMsg.innerHTML = '<span class="text-red">Vui lòng nhập số tiền cược hợp lệ!</span>';
            return;
        }

        if (bet > balance) {
            resultMsg.innerHTML = '<span class="text-red">Số tiền cược vượt quá số dư hiện có!</span>';
            return;
        }

        isRolling = true;
        resultMsg.innerHTML = '<span class="text-yellow">Đang lắc xí ngầu...</span>';

        // Hiệu ứng lắc xí ngầu (chạy trong 2 giây)
        let shakeInterval = setInterval(() => {
            setDiceValues(getRandomInt(1, 6), getRandomInt(1, 6), getRandomInt(1, 6));
        }, 100);

        setTimeout(() => {
            clearInterval(shakeInterval);

            let d1, d2, d3, sum;

            // Logic dàn xếp kết quả
            if (gameCount <= 5) {
                // 5 ván đầu: Ép ra TÀI (Tổng >= 11)
                do {
                    d1 = getRandomInt(1, 6);
                    d2 = getRandomInt(1, 6);
                    d3 = getRandomInt(1, 6);
                    sum = d1 + d2 + d3;
                } while (sum < 11);
            } else {
                // Từ ván 6 trở đi: Ép ra XỈU (Tổng <= 10)
                do {
                    d1 = getRandomInt(1, 6);
                    d2 = getRandomInt(1, 6);
                    d3 = getRandomInt(1, 6);
                    sum = d1 + d2 + d3;
                } while (sum > 10);
            }

            // Hiển thị kết quả thực tế
            setDiceValues(d1, d2, d3);

            const result = (sum >= 11) ? 'T' : 'X';
            const resultName = (result === 'T') ? 'TÀI' : 'XỈU';

            // Xử lý thắng/thua
            if (choice === result) {
                const winAmount = bet * 2;
                balance += winAmount;
                resultMsg.innerHTML = `Kết quả: ${sum} (${resultName})<br><span class="text-green">Chúc mừng! Bạn thắng x2 (+${winAmount.toLocaleString()}$)</span>`;
            } else {
                balance -= bet;
                resultMsg.innerHTML = `Kết quả: ${sum} (${resultName})<br><span class="text-red">Rất tiếc! Bạn thua (-${bet.toLocaleString()}$)</span>`;
            }

            // Cập nhật giao diện
            document.getElementById('balance').innerText = balance.toLocaleString();
            gameCount++;
            document.getElementById('game-count').innerText = gameCount;
            isRolling = false;

            if (balance <= 0) {
                resultMsg.innerHTML += '<br><span class="text-red">Bạn đã cháy túi! Game Over.</span>';
            }

        }, 2000);
    }
</script>

</body>
</html>
